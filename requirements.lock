# Runtime entry: standalone C++ executable; libstdc++ and libgcc statically linked.
# Vendored yyjson and utf8proc: native/vendor/manifest.json pins commits and SHA256.
# System libc/libm/zlib come from the fixed base images in Dockerfile.
# Python remains in the base image for compatibility/tools, not database execution.
# No pip, apt or network download in build RUN steps; base images must be cached/pulled.
